<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테슬라 이벤트 | 테슬라찬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   이벤트 목록 — 여기만 수정하면 됩니다!
   - start: 반드시 시간대 포함 ISO 형식 (예: "2026-10-22T06:30:00+09:00" = 한국 시간)
   - tag: "earnings" (실적 발표, 파란색) 또는 "event" (이벤트, 회색)
   - durationMin: 시작 후 '진행 중'으로 표시할 시간(분). 이후 '종료' → 지난 이벤트로 이동
   - tentative: true 이면 '시간 미확정' 표시
   - article: 관련 기사 { title, url, emoji, source }
   ===================================================================== */
const EVENTS = [
  {
    title: "2026년 3분기 실적 발표 (Q3 Earnings Call)",
    start: "2026-10-22T06:30:00+09:00", // 미국 10/21(수) 4:30pm CT / 5:30pm ET
    tag: "earnings",
    durationMin: 90,
    tentative: false,
    article: {
      title: "테슬라, 2026년 3분기 생산·인도 실적 발표 및 실적 발표일 공지",
      url: "https://www.nasdaq.com/press-release/tesla-third-quarter-2026-production-deliveries-deployments-2026-10-02",
      emoji: "📈", source: "Nasdaq (테슬라 공식 보도자료)"
    }
  },
  {
    title: "테슬라 로드스터 공개 이벤트 (일정 변경)",
    start: "2026-10-16T09:55:00+09:00", // 미국 10/15(목) 7:55pm CT
    tag: "event",
    durationMin: 120,
    tentative: false,
    article: {
      title: "테슬라 공식: 로드스터 이벤트, 이번 목요일 오후 7:55(미국 중부) 생중계",
      url: "https://x.com/Tesla/status/2110165104713183485",
      emoji: "🏎️", source: "Tesla 공식 X (@Tesla)"
    }
  },
];
</script>
<style>
:root{--accent:#2563eb;--accent-soft:#eaf1ff;--ink:#111827;--muted:#6b7280;--bg:#f5f7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.top{background:#fff;border-bottom:1px solid #e5e7eb}
.top .in{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px}
.logo em{font-style:normal;color:var(--accent)}
.yt{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:7px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}
.wrap{max-width:880px;margin:0 auto;padding:30px 20px 40px}
.hero{margin-bottom:24px}
.hero .kicker{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
h1{font-size:30px;font-weight:900;letter-spacing:-1px}
.sub{margin-top:6px;font-size:16px;color:var(--muted)}
h2{font-size:18px;font-weight:700;margin:34px 0 14px;color:var(--muted)}
.list{display:grid;gap:20px}
.card{background:#fff;border-radius:20px;box-shadow:0 6px 24px rgba(17,24,39,.07);padding:24px;display:grid;grid-template-columns:auto 1fr;gap:20px;position:relative;border-top:4px solid var(--accent)}
.card.ev-event{border-top-color:#e11d48}
.date{width:72px;height:80px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ev-event .date{background:#ffe8ee;color:#e11d48}
.date .m{font-size:13px;font-weight:700}.date .d{font-size:32px;font-weight:900;line-height:1.1;white-space:nowrap}
.body{min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 10px;margin-bottom:8px;background:var(--accent-soft);color:var(--accent)}
.tag.event{background:#ffe8ee;color:#e11d48}
.title{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:16px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd div{background:var(--bg);border:1px solid #e5e7eb;border-radius:14px;padding:12px 4px;text-align:center}
.cd b{display:block;font-size:34px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:12px;color:var(--muted);font-weight:500}
.cd.state{display:block;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;font-size:22px;font-weight:900;padding:20px}
.cap{font-size:13px;color:var(--muted);margin:12px 0 2px}.kst{font-size:15px;font-weight:700}
.tent{font-size:12px;color:#c2410c;margin-left:6px}
.art{display:flex;gap:14px;align-items:center;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin-top:16px;text-decoration:none;color:var(--ink);transition:.15s}
.art:hover{border-color:var(--accent);background:#fafcff}
.thumb{width:64px;height:64px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:30px;background:var(--accent-soft)}
.thumb small{display:none}
.event-bg{background:#ffe8ee}
.art h3{font-size:15px;font-weight:700;line-height:1.45}.art p{font-size:12px;color:var(--muted);margin-top:3px}
.past .card{opacity:.6;border-top-color:#9ca3af}
footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--accent);font-weight:700;text-decoration:none}
@media(max-width:600px){
 .top .in{padding:12px 14px}.logo{font-size:17px}.yt{font-size:12px;padding:6px 10px}
 .wrap{padding:22px 14px}h1{font-size:25px}.sub{font-size:14px}
 .card{grid-template-columns:1fr;padding:18px;gap:12px}
 .date{flex-direction:row;width:auto;height:auto;gap:6px;padding:6px 12px;justify-self:start;border-radius:10px}
 .date .d{font-size:18px}.title{font-size:17px}
 .cd{gap:6px}.cd b{font-size:24px}.cd span{font-size:11px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo"><i>⚡</i>테슬라찬 <em>Tslachan</em></div>
  <a class="yt" href="https://www.youtube.com/@Tslachan" target="_blank" rel="noopener">▶ YouTube @Tslachan</a>
</div></header>
<div class="wrap">
  <div class="hero"><span class="kicker">TSLACHAN COUNTDOWN</span>
  <h1>테슬라 이벤트</h1>
  <p class="sub">테슬라의 다가오는 이벤트와 지난 이벤트를 한눈에</p></div>
  <div id="upcoming" class="list"></div>
  <div id="pastWrap" hidden><h2>지난 이벤트</h2><div id="past" class="list past"></div></div>
  <footer>만든이: 테슬라찬 (Tslachan) · <a href="https://www.youtube.com/@Tslachan" target="_blank" rel="noopener">youtube.com/@Tslachan</a></footer>
</div>
<script>
const TZ="Asia/Seoul";
const fmt=(d,o)=>new Intl.DateTimeFormat("ko-KR",{timeZone:TZ,...o}).format(d);
const kstLabel=d=>{const p=Object.fromEntries(new Intl.DateTimeFormat("ko-KR",{timeZone:TZ,month:"numeric",day:"numeric",weekday:"short",hour:"numeric",minute:"2-digit",hour12:true}).formatToParts(d).map(x=>[x.type,x.value]));
  return `${p.month}월 ${p.day}일(${p.weekday}) ${p.dayPeriod} ${p.hour}:${p.minute} KST`;};
const TAGS={earnings:"실적 발표",event:"이벤트"};
const items=EVENTS.map(e=>({...e,t:new Date(e.start)}));
function card(e,i){
  return `<div class="card ev-${e.tag}">
  <div class="date"><div class="m">${fmt(e.t,{month:"numeric"}).replace(/\D/g,"")}월</div><div class="d">${fmt(e.t,{day:"numeric"}).replace(/\D/g,"")}<small style="font-size:.5em">일</small></div></div>
  <div class="body">
    <span class="tag ${e.tag}">${TAGS[e.tag]||e.tag}</span><div class="title">${e.title}</div>
    <div class="cd" id="cd${i}"></div>
    <p class="cap">이벤트 시작까지 남은 시간 (한국 시간 기준)</p>
    <p class="kst">🕒 ${kstLabel(e.t)}${e.tentative?'<span class="tent">시간 미확정</span>':''}</p>
    ${e.article?`<a class="art" href="${e.article.url}" target="_blank" rel="noopener">
      <div class="thumb ${e.tag}-bg">${e.article.emoji||"⚡"}<small>TESLA</small></div>
      <div><h3>${e.article.title}</h3><p>${e.article.source||""}</p></div></a>`:""}
  </div></div>`;}
let layoutKey="";
function tick(){
  const now=Date.now();
  items.forEach(e=>{e.end=e.t.getTime()+(e.durationMin||60)*60000;e.isPast=now>=e.end;});
  const up=items.filter(e=>!e.isPast).sort((a,b)=>a.t-b.t), past=items.filter(e=>e.isPast).sort((a,b)=>b.t-a.t);
  const key=up.map(e=>e.start).join()+"|"+past.length;
  if(key!==layoutKey){layoutKey=key;
    document.getElementById("upcoming").innerHTML=up.length?up.map(e=>card(e,items.indexOf(e))).join(""):'<div class="card">예정된 이벤트가 없습니다.</div>';
    document.getElementById("past").innerHTML=past.map(e=>card(e,items.indexOf(e))).join("");
    document.getElementById("pastWrap").hidden=!past.length;}
  items.forEach((e,i)=>{const el=document.getElementById("cd"+i);if(!el)return;
    const diff=e.t-now;
    if(e.isPast){el.className="cd state";el.textContent="종료";return;}
    if(diff<=0){el.className="cd state";el.textContent="🔴 진행 중";return;}
    el.className="cd";const s=Math.floor(diff/1000);
    const v=[[Math.floor(s/86400),"일"],[Math.floor(s%86400/3600),"시간"],[Math.floor(s%3600/60),"분"],[s%60,"초"]];
    el.innerHTML=v.map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
